name: Integration branch build

on:
  push:
    branches:
      - refactor/integration-auth-shell
  pull_request:
    branches:
      - subtype3860-auth-navigation-shell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: .NET 10 backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/MyApp.API.sln
      - name: Build
        run: dotnet build src/MyApp.API.sln --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test src/MyApp.API.sln --configuration Release --no-build --no-restore --filter "Category!=Integration"
      - name: Run PostgreSQL integration tests
        env:
          MYAPP_TEST_POSTGRES: Host=localhost;Port=5432;Database=myapp_test;Username=postgres;Password=postgres
        run: dotnet test src/MyApp.Infrastructure.Tests/MyApp.Infrastructure.Tests.csproj --configuration Release --no-build --no-restore --filter "Category=Integration"

  frontend:
    name: Vue frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
