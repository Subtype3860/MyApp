name: Backend build

on:
  push:
    branches:
      - refactor/clean-architecture
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore src/MyApp.API.sln

      - name: Build solution
        run: dotnet build src/MyApp.API.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/MyApp.API.sln --configuration Release --no-build --no-restore

      # PostgreSQL integration tests will be added with isolated test data.
